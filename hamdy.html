<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        class Student {
    constructor(id, name, grades, attendance) {
        this.id = id;
        this.name = name;
        this.grades = grades;
        this.attendance = attendance;
    }

    calculateAverage() {
        if (this.grades.length === 0) return 0;
        const sum = this.grades.reduce((acc, curr) => acc + curr, 0);
        return sum / this.grades.length;
    }

    calculateGrade(average) {
        if (average >= 85) return 'A';
        if (average >= 75) return 'B';
        if (average >= 65) return 'C';
        if (average >= 50) return 'D';
        if (average >= 40) return 'E';
        return 'F';
    }

    checkStatus(average) {
        // شروط النجاح: المتوسط 50 فأكثر والحضور لا يقل عن 75%
        if (average >= 50 && this.attendance >= 75) {
            return "ناجح";
        }
        return "يحتاج مراجعة";
    }
}

// بيانات الطلاب
const studentsList = [
    new Student(101, "أحمد محمد الإبياري", [88, 92, 85], 90),
    new Student(102, "محمود إبراهيم الخزامي", [42, 46, 44], 80),
    new Student(103, "سارة أحمد السيد", [65, 70, 68], 70),
    new Student(104, "يوسف خالد المنسي", [38, 41, 45], 85)
];

console.log("=========================================");
console.log("          التقرير العام لأداء الطلاب        ");
console.log("=========================================");

studentsList.forEach(student => {
    const avg = student.calculateAverage();
    const grade = student.calculateGrade(avg);
    const status = student.checkStatus(avg);

    console.log(`رقم الجلوس: ${student.id} | الاسم: ${student.name}`);
    console.log(`  - المتوسط: ${avg.toFixed(2)} | التقدير: ${grade} | الحالة: ${status}`);
    console.log("-----------------------------------------");
});

// لجنة الرأفة: استخراج الطلاب اللي متوسطهم بين 40 و 49
const strugglingStudents = studentsList.filter(student => {
    const avg = student.calculateAverage();
    return avg >= 40 && avg < 49;
});

// إضافة 5 درجات رأفة للطلاب المتعثرين
const adjustedStrugglingStudents = strugglingStudents.map(student => {
    const oldAvg = student.calculateAverage();
    const newAvg = oldAvg + 5;
    return {
        id: student.id,
        name: student.name,
        originalAverage: oldAvg.toFixed(2),
        adjustedAverage: newAvg.toFixed(2),
        newGrade: student.calculateGrade(newAvg),
        newStatus: student.checkStatus(newAvg)
    };
});

// حساب المتوسط العام للطلاب بعد الرأفة
const totalAdjustedAverages = adjustedStrugglingStudents.reduce((acc, curr) => acc + parseFloat(curr.adjustedAverage), 0);

const clemencyAverage = adjustedStrugglingStudents.length > 0 
    ? totalAdjustedAverages / adjustedStrugglingStudents.length 
    : 0;

console.log("\n=========================================");
console.log("          تقرير لجنة الرأفة (+5 درجات)         ");
console.log("=========================================");
console.log(adjustedStrugglingStudents);

console.log("=========================================");
console.log(`متوسط درجات الطلاب المتعثرين بعد التعديل: ${clemencyAverage.toFixed(2)}`);
console.log("=========================================");

    </script>
</body>
</html>
